name: worldswithin_flutter
description: WorldsWithin on-device reconstruction from a local capture to a textured GLB.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  ffi: ^2.1.4
  image: ^4.2.0
  path_provider: ^2.1.5
  pw_hevc:
    path: packages/pw_hevc
  pw_shared_viewer:
    path: packages/pw_shared_viewer
  uuid: 4.6.0
  vector_math: ^2.2.0
  xml: 6.6.1

dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
